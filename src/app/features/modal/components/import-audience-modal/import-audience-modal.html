<p-dialog 
  *ngIf="visible"
  [(visible)]="visible" 
  [modal]="true" 
  [draggable]="false" 
  [resizable]="false"
  [appendTo]="'body'"
  [style]="{ width: '480px' }"
  styleClass="import-audience-dialog"
  (onHide)="onHide()">

  <!-- Custom Header -->
  <ng-template pTemplate="header">
    <div class="d-flex align-items-center gap-2">
      <i class="pi pi-file-excel text-brown fs-5"></i>
      <span class="fw-bold text-dark fs-6">Import Audience</span>
    </div>
  </ng-template>

  <!-- Content Body -->
  <div class="pt-1">
    <p class="description-text mb-3">
      Upload a bulk list of travelers for mass marketing campaigns. We support `.csv` and `.xlsx` formats.
    </p>

    <!-- Upload Box -->
    <div 
      class="upload-dropzone p-4 text-center mb-4"
      [class.dragging]="isDragging"
      (dragover)="onDragOver($event)"
      (dragleave)="onDragLeave($event)"
      (drop)="onDrop($event)">
      
      <div class="icon-circle mb-3">
        <i class="pi pi-cloud-upload text-secondary fs-3"></i>
      </div>

      <p class="drop-title fw-bold text-dark mb-1">Drag and drop your file here</p>
      <p class="drop-subtitle text-muted mb-3">or click to browse from your computer</p>

      <div class="d-flex justify-content-center">
        <label class="custom-file-btn border rounded d-flex align-items-center overflow-hidden mb-0 cursor-pointer">
          <span class="choose-btn px-3 py-1.5 text-dark fw-medium">Choose File</span>
          <span class="file-name px-3 py-1.5 text-muted bg-white text-truncate" style="max-width: 180px;">
            {{ selectedFile ? selectedFile.name : 'No file chosen' }}
          </span>
          <input type="file" (change)="onFileSelected($event)" accept=".csv, .xlsx" class="d-none">
        </label>
      </div>

    </div>

    <!-- Modal Actions -->
    <div class="d-flex justify-content-end gap-2 pt-3 border-top">
      <button 
        type="button" 
        class="btn btn-cancel" 
        (click)="onHide()">
        Cancel
      </button>

      <button 
        type="button" 
        class="btn btn-save" 
        [disabled]="!selectedFile"
        (click)="onSubmit()">
        Import List
      </button>
    </div>

  </div>

</p-dialog>
